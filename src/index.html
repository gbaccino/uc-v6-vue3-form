<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue + Vuetify Test</title>

    <!-- Vuetify CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/vuetify@3.6.11/dist/vuetify.min.css"
      rel="stylesheet"
    />

    <!-- Material Design Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css"
      rel="stylesheet"
    />

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <!-- Vuetify JS -->
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.6.11/dist/vuetify.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <v-app>
        <v-container id="mainContainer">
          <v-row>
            <!-- Lado izquierdo -->
            <v-col cols="6">
              <v-card variant="elevated" class="text-white pa-4">
                <v-text-field
                  label="Campana"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  class="w-50"
                ></v-text-field>
                <v-text-field
                  label="Agente"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  class="w-50"
                ></v-text-field>
                <v-text-field
                  label="GUID"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  class="w-50"
                ></v-text-field>
                <v-btn class="bg bg-green mr-6">Tokenización</v-btn>
                <v-btn class="bg bg-green ml-6">Sanas Practicas</v-btn>
              </v-card>
            </v-col>

            <!-- Lado derecho -->
            <v-col cols="6">
              <v-card variant="elevated" class="text-white pa-4">
                <h4 class="mb-4">Tipificaciones</h4>

                <!-- Campaign selector - always show, disable when CTI present or call active -->
                <v-autocomplete
                  v-model="campaign.name"
                  :items="availableCampaigns"
                  label="Campaña"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  class="w-75 mb-3"
                  :disabled="hasCTI || isCallActive"
                  :readonly="hasCTI || isCallActive"
                  @update:model-value="onCampaignSelected"
                ></v-autocomplete>

                <v-autocomplete
                  v-if="dispoLevels[0] && dispoLevels[0].length > 0"
                  v-model="selected[0]"
                  :items="dispoLevels[0]"
                  label="Nivel 1"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  @update:model-value="loadNext(0)"
                ></v-autocomplete>

                <v-autocomplete
                  v-if="selected[0] && dispoLevels[1] && dispoLevels[1].length > 0"
                  v-model="selected[1]"
                  :items="dispoLevels[1]"
                  label="Nivel 2"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  @update:model-value="loadNext(1)"
                ></v-autocomplete>

                <v-autocomplete
                  v-if="selected[1] && dispoLevels[2] && dispoLevels[2].length > 0"
                  v-model="selected[2]"
                  :items="dispoLevels[2]"
                  label="Nivel 3"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-autocomplete>

                <v-textarea
                  v-model="notes"
                  label="Notas"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-textarea>
              </v-card>

              <v-btn
                block
                class="mt-4 finish-btn"
                color="primary"
                :loading="isFinishing"
                :disabled="!clientData.Guid"
                @click="finish"
              >
                Finish
              </v-btn>
            </v-col>
          </v-row>
          <v-row>
            <v-col cols="12" class="mt-4">
              <v-card variant="elevated" class="text-white pa-4">
                <v-row>
                  <v-col cols="6">
                    <template v-for="key in leftKeys" :key="key">
                      <v-text-field
                        v-model="clientData[key]"
                        :label="formatLabel(key)"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                        class="w-75"
                      ></v-text-field>
                    </template>
                  </v-col>
                  <v-col cols="6">
                    <template v-for="key in rightKeys" :key="key">
                      <v-text-field
                        v-model="clientData[key]"
                        :label="formatLabel(key)"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                        class="w-75"
                      ></v-text-field>
                    </template>
                  </v-col>
                </v-row>
              </v-card>
            </v-col>
          </v-row>
        </v-container>
      </v-app>
    </div>

    <script src="index.js"></script>
  </body>
</html>
