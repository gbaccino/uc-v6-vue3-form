<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue + Vuetify Test</title>

    <!-- Vuetify CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/vuetify@3.6.11/dist/vuetify.min.css"
      rel="stylesheet"
    />

    <!-- Material Design Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css"
      rel="stylesheet"
    />

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <!-- Vuetify JS -->
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.6.11/dist/vuetify.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <v-app>
        <v-container id="mainContainer" fluid>
          <v-tabs
            v-model="activeTab"
            bg-color="light-blue-darken-4"
            class="rounded-lg mb-2"
          >
            <v-tab value="form">Formulario</v-tab>
            <v-tab value="list">Búsqueda de Usuarios</v-tab>
          </v-tabs>

          <v-window v-model="activeTab">
            <!-- Form Tab -->
            <v-window-item value="form">
              <v-row>
                <!-- Lado izquierdo -->
                <v-col cols="4">
                  <v-card variant="elevated" class="text-white pa-4">
                    <!-- Interaction Channel Display -->
                    <v-chip
                      v-if="interaction.channel"
                      :color="getChannelColor()"
                      class="mb-3"
                      size="large"
                      prepend-icon="mdi-alpha-c-circle"
                    >
                      <strong>Canal: {{ interaction.channel }}</strong>
                    </v-chip>

                    <!-- Common Fields -->
                    <v-text-field
                      v-model="interaction.numero_documento"
                      :rules="[rules.document]"
                      placeholder="Número de documento"
                      label="Número de documento"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                    ></v-text-field>

                    <v-autocomplete
                      v-model="interaction.tipo_documento_id"
                      :items="catalogs.tipoDocumento"
                      item-value="id"
                      item-title="nombre"
                      label="Tipo de documento"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>

                    <v-text-field
                      v-model="interaction.razon_social"
                      :rules="[rules.required]"
                      placeholder="Razón social"
                      label="Razón social"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                    ></v-text-field>

                    <v-autocomplete
                      v-model="interaction.tipo_usuario_id"
                      :rules="[rules.required]"
                      :items="catalogs.tipoUsuario"
                      item-value="id"
                      item-title="nombre"
                      label="Tipo de usuario"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>

                    <v-autocomplete
                      v-model="interaction.region_id"
                      :items="catalogs.region"
                      item-value="id"
                      item-title="nombre"
                      label="Región"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>

                    <v-autocomplete
                      v-model="interaction.tema_consulta_id"
                      :rules="[rules.required]"
                      :items="catalogs.temaConsulta"
                      item-value="id"
                      item-title="nombre"
                      label="Tema de consulta"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>

                    <v-autocomplete
                      v-model="interaction.estado_consulta_id"
                      :rules="[rules.required]"
                      :items="catalogs.estadoConsulta"
                      item-value="id"
                      item-title="nombre"
                      label="Estado de consulta"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>

                    <v-autocomplete
                      v-model="interaction.organo_atencion_id"
                      :items="catalogs.organoAtencion"
                      item-value="id"
                      item-title="nombre"
                      label="Órgano de atención"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>

                    <v-autocomplete
                      v-model="interaction.satisfaccion_servicio_id"
                      :items="catalogs.satisfaccionServicio"
                      item-value="id"
                      item-title="nombre"
                      label="Satisfacción del servicio"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>
                  </v-card>
                </v-col>
                <!-- Lado central -->
                <v-col cols="4">
                  <v-card variant="elevated" class="text-white pa-4 mb-4">
                    <!-- Channel-Specific Fields: LLAMADA -->
                    <div v-if="interaction.channel === 'LLAMADA'">
                      <h4 class="mb-3">Datos de Llamada</h4>

                      <v-text-field
                        v-model="llamadaData.numero_telefonico"
                        :rules="[rules.required, rules.phoneRequired]"
                        placeholder="Número telefónico"
                        label="Número telefónico"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-text-field
                        v-model.number="llamadaData.duracion_llamada"
                        type="number"
                        placeholder="Duración (segundos)"
                        label="Duración de llamada (segundos)"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-autocomplete
                        v-model="llamadaData.acuerdo_marco_id"
                        :items="catalogs.acuerdoMarco"
                        item-value="id"
                        item-title="nombre"
                        label="Acuerdo Marco"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                        clearable
                      ></v-autocomplete>

                      <v-textarea
                        v-model="llamadaData.detalle_acuerdo_marco"
                        placeholder="Detalle del acuerdo marco"
                        label="Detalle del acuerdo marco"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-textarea>

                      <v-textarea
                        v-model="llamadaData.detalle_consulta"
                        placeholder="Detalles de la consulta"
                        label="Detalles de la consulta"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-textarea>
                    </div>

                    <!-- Channel-Specific Fields: WHATSAPP -->
                    <div v-if="interaction.channel === 'WHATSAPP'">
                      <h4 class="mb-3">Datos de WhatsApp</h4>

                      <v-text-field
                        v-model="whatsappData.numero_celular"
                        :rules="[rules.required, rules.phoneRequired]"
                        placeholder="Número de celular"
                        label="Número de celular"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-textarea
                        v-model="whatsappData.consulta"
                        placeholder="Consulta del usuario"
                        label="Consulta"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-textarea>

                      <v-textarea
                        v-model="whatsappData.respuesta"
                        placeholder="Respuesta proporcionada"
                        label="Respuesta"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-textarea>

                      <v-autocomplete
                        v-model="whatsappData.valoracion_atencion_id"
                        :items="catalogs.valoracionAtencion"
                        item-value="id"
                        item-title="nombre"
                        label="Valoración de atención"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                        clearable
                      ></v-autocomplete>
                    </div>

                    <!-- Channel-Specific Fields: EMAIL -->
                    <div v-if="interaction.channel === 'EMAIL'">
                      <h4 class="mb-3">Datos de Email</h4>

                      <v-text-field
                        v-model="emailData.correo"
                        :rules="[rules.required, rules.email]"
                        placeholder="Correo electrónico"
                        label="Correo electrónico"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-text-field
                        v-model="emailData.asunto"
                        placeholder="Asunto del correo"
                        label="Asunto"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-text-field
                        v-model="emailData.fecha_atencion"
                        type="date"
                        label="Fecha de atención"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-autocomplete
                        v-model="interaction.estado_consulta_id"
                        :items="catalogs.estadoConsulta"
                        item-value="id"
                        item-title="nombre"
                        label="Estado de atención"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                        clearable
                      ></v-autocomplete>

                      <v-checkbox
                        v-model="emailData.estado_atencion_encauzado"
                        label="Encauzado"
                      ></v-checkbox>

                      <div v-if="emailData.estado_atencion_encauzado">
                        <v-text-field
                          v-model="emailData.fecha_derivacion"
                          type="date"
                          label="Fecha de derivación"
                          density="compact"
                          bg-color="light-blue-darken-4"
                          variant="solo"
                        ></v-text-field>

                        <v-text-field
                          v-model.number="emailData.dias_atencion_organo"
                          type="number"
                          label="Días de atención en órgano"
                          density="compact"
                          bg-color="light-blue-darken-4"
                          variant="solo"
                        ></v-text-field>

                        <v-autocomplete
                          v-model="emailData.estado_atencion_organo_id"
                          :items="catalogs.estadoConsulta"
                          item-value="id"
                          item-title="nombre"
                          label="Estado de atención en órgano"
                          density="compact"
                          bg-color="light-blue-darken-4"
                          variant="solo"
                          clearable
                        ></v-autocomplete>
                      </div>
                    </div>

                    <!-- Channel-Specific Fields: PRESENCIAL -->
                    <div v-if="interaction.channel === 'PRESENCIAL'">
                      <h4 class="mb-3">Datos de Atención Presencial</h4>

                      <v-text-field
                        v-model="presencialData.hora_ingreso"
                        :rules="[rules.required]"
                        type="time"
                        label="Hora de ingreso"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-text-field
                        v-model="presencialData.hora_salida"
                        type="time"
                        label="Hora de salida"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-text-field
                        v-model="presencialData.numero_telefonico"
                        :rules="[rules.phone]"
                        placeholder="Número telefónico"
                        label="Número telefónico (opcional)"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-text-field
                        v-model="presencialData.correo"
                        :rules="presencialData.correo ? [rules.email] : []"
                        placeholder="Correo electrónico"
                        label="Correo electrónico (opcional)"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-text-field>

                      <v-textarea
                        v-model="presencialData.detalle_consulta"
                        placeholder="Detalles de la consulta"
                        label="Detalles de la consulta"
                        density="compact"
                        bg-color="light-blue-darken-4"
                        variant="solo"
                      ></v-textarea>
                    </div>

                    <!-- WEBCHAT has no additional fields -->
                    <div v-if="interaction.channel === 'WEBCHAT'">
                      <v-alert type="info" density="compact">
                        Webchat solo requiere los campos comunes de interacción
                      </v-alert>
                    </div>
                  </v-card>
                </v-col>

                <!-- Lado derecho -->
                <v-col cols="4">
                  <v-card variant="elevated" class="text-white pa-4 mb-4">
                    <v-text-field
                      v-model="agent"
                      placeholder="Atendido por"
                      label="Atendido por"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      readonly
                    ></v-text-field>

                    <v-text-field
                      v-model="interaction.guid"
                      label="ID de Interacción (GUID)"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      readonly
                    ></v-text-field>

                    <v-text-field
                      v-model="interaction.fecha_hora_interaccion"
                      label="Fecha y hora de interacción"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      readonly
                    ></v-text-field>
                  </v-card>
                  <v-row class="mt-4">
                    <v-col cols="12">
                      <v-btn
                        block
                        color="primary"
                        size="large"
                        :loading="isProcessing"
                        @click="saveAndFinish"
                      >
                        <v-icon left>mdi-content-save</v-icon>
                        Guardar
                      </v-btn>
                    </v-col>
                  </v-row>
                </v-col>
              </v-row>
            </v-window-item>

            <!-- User List Tab -->
            <v-window-item value="list">
              <v-card variant="elevated" class="text-white pa-4">
                <h3 class="mb-4">Búsqueda de Usuarios</h3>

                <v-row class="mb-4">
                  <v-col cols="12" md="4">
                    <v-text-field
                      v-model="userSearch.phone"
                      label="Teléfono"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-text-field>
                  </v-col>
                  <v-col cols="12" md="4">
                    <v-text-field
                      v-model="userSearch.document"
                      label="Número de documento"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-text-field>
                  </v-col>
                  <v-col cols="12" md="4">
                    <v-text-field
                      v-model="userSearch.razonSocial"
                      label="Razón Social"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-text-field>
                  </v-col>
                  <v-col cols="12" md="4">
                    <v-autocomplete
                      v-model="userSearch.channels"
                      :items="availableChannels"
                      label="Canales"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      multiple
                      chips
                      clearable
                    ></v-autocomplete>
                  </v-col>
                  <v-col cols="12" md="4">
                    <v-autocomplete
                      v-model="userSearch.agentId"
                      :items="agentList"
                      item-value="id"
                      item-title="accountcode"
                      label="Agente"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>
                  </v-col>
                  <v-col cols="12" md="4">
                    <v-autocomplete
                      v-model="userSearch.estadoConsultaId"
                      :items="catalogs.estadoConsulta"
                      item-value="id"
                      item-title="nombre"
                      label="Estado de Consulta"
                      density="compact"
                      bg-color="light-blue-darken-4"
                      variant="solo"
                      clearable
                    ></v-autocomplete>
                  </v-col>
                </v-row>

                <v-btn
                  color="primary"
                  class="mb-4"
                  @click="searchUsers"
                  :loading="isSearching"
                >
                  <v-icon left>mdi-magnify</v-icon>
                  Buscar
                </v-btn>

                <v-data-table
                  :headers="userTableHeaders"
                  :items="userSearchResults"
                  :loading="isSearching"
                  class="elevation-1 custom-table"
                  density="compact"
                  :items-per-page="10"
                >
                  <template v-slot:item.actions="{ item }">
                    <v-btn
                      size="small"
                      color="primary"
                      @click="loadUserToForm(item)"
                    >
                      Cargar
                    </v-btn>
                  </template>

                  <template v-slot:no-data>
                    <div class="pa-4">
                      {{ userSearchResults.length === 0 && !isSearching ? `No se
                      encontraron usuarios. Use los filtros para buscar.`
                      :`Cargando...` }}
                    </div>
                  </template>
                </v-data-table>
              </v-card>
            </v-window-item>
          </v-window>
        </v-container>
      </v-app>
    </div>

    <script src="index.js"></script>
  </body>
</html>
