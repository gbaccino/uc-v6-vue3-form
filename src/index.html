<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Vue + Vuetify Test</title>

    <!-- Vuetify CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/vuetify@3.6.11/dist/vuetify.min.css"
      rel="stylesheet"
    />

    <!-- Material Design Icons -->
    <link
      href="https://cdn.jsdelivr.net/npm/@mdi/font/css/materialdesignicons.min.css"
      rel="stylesheet"
    />

    <!-- Vue -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>

    <!-- Vuetify JS -->
    <script src="https://cdn.jsdelivr.net/npm/vuetify@3.6.11/dist/vuetify.min.js"></script>

    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="app">
      <v-app>
        <v-container id="mainContainer">
          <v-row>
            <!-- Lado izquierdo -->
            <v-col cols="6">
              <v-card variant="elevated" class="text-white pa-4">
                <v-text-field
                  placeholder="Numero"
                  label="Numero"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-text-field
                  placeholder="Fecha de atencion"
                  label="Fecha de atencion"
                  density="compact"
                  readonly
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-text-field
                  placeholder="Hora de ingreso"
                  label="Hora de ingreso"
                  density="compact"
                  readonly
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-text-field
                  placeholder="Hora de salida"
                  label="Hora de salida"
                  density="compact"
                  readonly
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-text-field
                  placeholder="RUC/DNI"
                  label="RUC/DNI"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-text-field
                  placeholder="Nombre del usuario"
                  label="Nombre del usuario"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-text-field
                  placeholder="Telefono"
                  label="Telefono"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-text-field
                  placeholder="Correo electronico"
                  label="Correo electronico"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-select
                  placeholder="Region"
                  label="Region"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-select>
                <v-select
                  placeholder="Tipo de usuario"
                  label="Tipo de usuario"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-select>
                <v-select
                  placeholder="Tema consultado"
                  label="Tema consultado"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-select>
                <v-select
                  placeholder="Area"
                  label="Area"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-select>
                <v-text-field
                  placeholder="Personal que atendio"
                  label="Personal que atendio"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
                <v-text-field
                  placeholder="Valoracion del servicio"
                  label="Valoracion del servicio"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-text-field>
              </v-card>
            </v-col>

            <!-- Lado derecho -->
            <v-col cols="6">
              <v-card variant="elevated" class="text-white pa-4">
                <h4 class="mb-4">Tipificaciones</h4>

                <!-- Campaign selector - always show, disable when CTI present or call active -->
                <v-autocomplete
                  v-model="campaign.name"
                  :items="availableCampaigns"
                  label="Campaña"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  class="mb-3"
                  :disabled="hasCTI || isCallActive"
                  :readonly="hasCTI || isCallActive"
                  @update:model-value="onCampaignSelected"
                ></v-autocomplete>

                <v-autocomplete
                  v-if="dispoLevels[0] && dispoLevels[0].length > 0"
                  v-model="selected[0]"
                  :items="dispoLevels[0]"
                  label="Nivel 1"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  @update:model-value="loadNext(0)"
                ></v-autocomplete>

                <v-autocomplete
                  v-if="selected[0] && dispoLevels[1] && dispoLevels[1].length > 0"
                  v-model="selected[1]"
                  :items="dispoLevels[1]"
                  label="Nivel 2"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  @update:model-value="loadNext(1)"
                ></v-autocomplete>

                <v-autocomplete
                  v-if="selected[1] && dispoLevels[2] && dispoLevels[2].length > 0"
                  v-model="selected[2]"
                  :items="dispoLevels[2]"
                  label="Nivel 3"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-autocomplete>

                <v-text-field
                  v-if="needsReschedule"
                  v-model="rescheduleDate"
                  label="Fecha de reagendado"
                  type="datetime-local"
                  :min="minDateTime"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                  class="datetime-picker-field"
                  @change="rescheduleDate = formatRescheduleDate($event.target.value)"
                ></v-text-field>

                <v-textarea
                  v-model="notes"
                  label="Notas"
                  density="compact"
                  bg-color="light-blue-darken-4"
                  variant="solo"
                ></v-textarea>
              </v-card>

              <v-btn
                block
                class="mt-4 finish-btn"
                color="primary"
                :loading="isFinishing"
                @click="finish"
              >
                Tipificar y cerrar
              </v-btn>
            </v-col>
          </v-row>
        </v-container>
      </v-app>
    </div>

    <script src="index.js"></script>
  </body>
</html>
